<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- Full Screen Container -->
    <div class="container-fluid">
        <!-- First Row -->
        <div class="row border">
            <!-- Website Name -->
            <div class="col-3 border-end">
                <h3 class="p-3">
                    Online Stationery
                </h3>
            </div>

            <!-- Main Heading -->
            <div class="col-9">
                <h3 class="p-3">
                    Products
                </h3>
            </div>
        </div>

        <!-- Second Row -->
        <div class="row">
            <!-- Left Side Navigation -->
            <div class="col-3 border-end">
                <div class="d-flex flex-column gap-3 p-4">
                    <a href="#" class="text-decoration-none">
                        Home
                    </a>
                    <a href="#" class="text-decoration-none">
                        About Us
                    </a>

                    <a href="#" class="text-decoration-none">
                        Contact
                    </a>

                    <a href="#" class="text-decoration-none">
                        Product
                    </a>
                </div>
            </div>


            <!-- Right Side Content -->
            <div class="col-9 p-4">
                <!-- Product Cards -->
                <div class="row g-4">

                    <!-- Product 1 -->
                    <div class="col-md-4">

                        <div class="card">

                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRlIFxSrp-P7oFQINVaESo4YdAatYg0wEcEntgyMSI_Q&s=10"
                                class="card-img-top" alt="Pencil Kit" width="100px" height="450px">
                            <div class="card-body">
                                <h5 class="card-title">
                                    Stationery Product
                                </h5>

                                <p class="card-text">
                                    Pencil Kit
                                </p>

                                <h5>
                                    ₹150
                                </h5>

                                <button type="button" class="btn btn-primary" data-bs-toggle="collapse"
                                    data-bs-target="#checkout">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>


                    <!-- Product 2 -->

                    <div class="col-md-4">
                        <div class="card">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJjOt0NkFmerNIt55hfZEyp-dXuvTManPEm64r5K0tqw&s=10"
                                class="card-img-top" alt="Calculator" width="100px" height="450px">
                            <div class="card-body">
                                <h5 class="card-title">
                                    Calculator
                                </h5>
                                <p class="card-text">
                                    Calculator
                                </p>

                                <h5>
                                    ₹250
                                </h5>

                                <button type="button" class="btn btn-primary" data-bs-toggle="collapse"
                                    data-bs-target="#checkout">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>


                    <!-- Product 3 -->

                    <div class="col-md-4">
                        <div class="card">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwwWRcRStVTCXfFpqrYc8e9_2zosZaApFbP9nbFGaHLg&s"
                                class="card-img-top" alt="pouch" width="100px" height="450px">
                            <div class="card-body">

                                <h5 class="card-title">
                                    Pouch
                                </h5>

                                <p class="card-text">
                                    Pouch
                                </p>

                                <h5>
                                    ₹75
                                </h5>

                                <button type="button" class="btn btn-primary" data-bs-toggle="collapse"
                                    data-bs-target="#checkout">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>


                    <!-- Product 4 -->

                    <div class="col-md-4">
                        <div class="card">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSU7IJbxxC7UN_O1Ho-TNU7PYOgW4F1zVIi8N-WBfrOA&s=10"
                                class="card-img-top" alt="Drawing Book" width="100px" height="450px">

                            <div class="card-body">

                                <h5 class="card-title">
                                    Drawing Book
                                </h5>

                                <p class="card-text">
                                    Drawing Book
                                </p>

                                <h5>
                                    ₹100
                                </h5>

                                <button type="button" class="btn btn-primary" data-bs-toggle="collapse"
                                    data-bs-target="#checkout">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="collapse mt-4" id="checkout">
                        <div class="card">
                            <div class="card-header">
                                <h4> Account Details </h4>
                            </div> 
                            
                            <div class="card-body">
                                <form>
                                    <div class="mb-3"> <label class="form-label"> Name </label> 
                                        <input type="text" class="form-control" placeholder="Enter your name"> 
                                    </div>
                                    <div class="mb-3"> <label class="form-label"> Email </label> 
                                        <input type="email" class="form-control" placeholder="Enter your email"> 
                                    </div>
                                    <div class="mb-3"> <label class="form-label"> Address </label> 
                                        <textarea class="form-control" rows="3" placeholder="Enter your address"></textarea> 
                                    </div>
                                    <div class="mb-3"> <label class="form-label"> Payment Method </label> 
                                        <select class="form-select">
                                            <option selected> Select Payment Method </option>
                                            <option> Cash on Delivery </option>
                                            <option> UPI </option>
                                            <option> Credit Card </option>
                                            <option> Debit Card </option>
                                        </select> </div> <button type="submit" class="btn btn-success"> Place Order
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</body>
</html>
