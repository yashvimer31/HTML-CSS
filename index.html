<!DOCTYPE html>
<html>
<head>
    <title>Header and Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Header -->
    <header class="bg-purple-300 text-black p-4">

        <div class="flex justify-between items-center">

            <!-- Logo -->
            <h1 class="text-2xl font-bold">🐾 PawCare</h1>

            <!-- Navigation -->
            <nav class="flex gap-8">

                <a href="#" class="hover:text-yellow-700">Home</a>

                <a href="#" class="hover:text-yellow-700">About</a>

                <!-- Dropdown -->
                <div class="relative group">

                    <button class="hover:text-yellow-700">
                        Products 
                    </button>

                    <div class="hidden group-hover:block absolute bg-purple-100 text-black p-2 w-32">

                        <a href="#" class="block p-2 hover:bg-gray-300">
                            Laptop
                        </a>

                        <a href="#" class="block p-2 hover:bg-gray-300">
                            Mobile
                        </a>

                        <a href="#" class="block p-2 hover:bg-gray-300">
                            Shoes
                        </a>

                    </div>
                </div>

                <a href="#" class="hover:text-yellow-700">Contact</a>

            </nav>

        </div>

    </header>

</body>
</html>
