<!DOCTYPE html>
<html>
<head>
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-50">

    <!-- Header -->
    <header class="bg-blue-400 text-white p-3">
        <h1 class="text-2xl">MyShop</h1>
    </header>

    <!-- Products -->
    <div class="p-4">
        <h2 class="text-2xl text-center mb-4">Our Products</h2>

        <div class="flex flex-wrap justify-center gap-6">

            <!-- Product 1 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3bGZquTmyZtrsQTPSy9OX9FAazU_OvKS-LaBweiKNkw&s=10" class="w-full">
                <h3 class="text-xl">Laptop</h3>
                <p>Price: ₹45,999</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 2 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSov5An-uhmjlmwmetxN3GEGPF5UVGP6yJ3t3czS2kumQ&s=10" class="w-full">
                <h3 class="text-xl">Mobile</h3>
                <p>Price: ₹19,999</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 3 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPNY9X-Fg-o6t7h8Cf39S7jAWjmVyFUu-p7YzhSfuSyg&s" class="w-full">
                <h3 class="text-xl">Shoes</h3>
                <p>Price: ₹2,499</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 4 -->
            <div class="bg-blue-100 p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkw4TQ2d3hyWr9rW6qYfejVIjoWDIuDNprmL06ObgFLQ&s=10" class="w-full">
                <h3 class="text-xl">Watch</h3>
                <p>Price: ₹3,499</p>
                <button class="bg-blue-600 text-white p-2 mt-2">Buy Now</button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-4">
        MyShop © 2026
    </footer>

</body>
</html>
