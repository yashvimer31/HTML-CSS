<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
    .box
    {
      border: 2px double purple;
      margin: 10px;
      background-color:darkorange;
      text-align: center;
      font-weight: bold;
    }
    .container
    {
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color:burlywood;
      height: 100px;
      width: 200px;
      align-items: flex-start;
      flex-wrap: wrap;
      align-content:space-around;
      
    }
  </style>
</head>
<body>
    <div class="container">
      <div class="box">0</div>
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
      <div class="box">9</div>
    </div>
</body>
</html>
